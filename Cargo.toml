[workspace]
members = ["punctum", "punctum-macros", "punctum-bundler", "shader-app", "shader-app-3d"]
resolver = '2'
exclude = ["default-shaders"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ss123she/punctum"
keywords = ["gpu", "compute-shader", "wgpu", "rust-gpu", "spirv"]
categories = ["rendering", "graphics", "game-development", "development-tools"]

[workspace.dependencies]
punctum = { version = "0.1.0", path = "punctum" }
punctum-macros = { version = "0.1.0", path = "punctum-macros" }
punctum-bundler = { version = "0.1.0", path = "punctum-bundler" }
punctum-common = { version = "0.1.0", path = "punctum-common" }
