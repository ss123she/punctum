[package]
name = "punctum-bundler"
description = "Build-script bundler for punctum: collects #[gpu_kernel] code into a shadow crate and compiles it to SPIR-V with rust-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
cargo-gpu-install = "0.11"
walkdir = "2"
syn = { version = "3", features = ["visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
