pre-commit:
  parallel: false
  jobs:
    - name: cargo fmt
      run: cargo fmt
      glob: "**/*.rs"
      stage_fixed: true

    - name: cargo check
      run: cargo check --all-targets
      glob: "**/*.rs"

    - name: cargo clippy
      run: cargo clippy --all-targets
      glob: "**/*.rs"

pre-push:
  jobs:
    - name: test
      run: cargo test --all-targets
