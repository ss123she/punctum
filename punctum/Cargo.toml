[package]
name = "punctum"
description = "Minimal framework for writing and launching compute shaders in pure Rust (wgpu + rust-gpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
winit = "0.30"
anyhow = "1.0"
log = { version = "0.4", features = ["release_max_level_info"] }
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "vulkan",
    "std",
    "spirv"
] }
env_logger = "0.11"
pollster = "1.0"
punctum-macros = {path = "../punctum-macros"}
spirv-std = "0.11"
glam = { version = "0.34", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }

[build-dependencies]
punctum-bundler = { path = "../punctum-bundler" }
