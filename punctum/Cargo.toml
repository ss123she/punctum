[package]
name = "punctum"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
winit = "0.30"
anyhow = "1.0"
log = { version = "0.4", features = ["release_max_level_info"] }
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "vulkan",
    "std",
    "spirv"
] }
env_logger = "0.11"
pollster = "1.0"
punctum-macros = {path = "../punctum-macros"}
spirv-std = "0.11"
glam = { version = "0.34", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }

[build-dependencies]
punctum-bundler = { path = "../punctum-bundler" }
